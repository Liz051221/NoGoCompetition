<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoGo · 不围棋</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20332b;background:#f4f3ee}*{box-sizing:border-box}body{margin:0;padding:32px 24px}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cdd6cb;margin-bottom:24px}h1{font-weight:650;letter-spacing:2px}small,.muted{color:#647269}section{display:grid;grid-template-columns:minmax(300px,650px) 300px;gap:24px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px}canvas{width:100%;display:block;touch-action:manipulation;border-radius:10px;background:#dfbb80}label{display:block;margin:16px 0 6px}select,button{font:inherit;width:100%;padding:11px;border-radius:8px;border:1px solid #bdc9be;background:white;color:#20332b}button{cursor:pointer}button.primary{background:#24533d;color:#fff;margin-top:18px;border:0}button:disabled{opacity:.5;cursor:wait}.status{font-size:18px;min-height:55px;line-height:1.5}.moves{height:190px;overflow:auto;line-height:1.8;font-variant-numeric:tabular-nums;border-top:1px solid #eee;padding-top:12px}.error{color:#aa302a;min-height:24px}p{line-height:1.7}a{color:inherit}input{accent-color:#24533d}.row{display:flex;gap:8px;align-items:center;margin:14px 0}.row label{margin:0}footer{font-size:13px;color:#647269;margin:16px 0}@media(max-width:800px){body{padding:16px}section{grid-template-columns:1fr}.moves{height:140px}header small{display:none}}
</style>
<main><header><h1>NoGo <small>不围棋</small></h1><small>9 × 9 · 本地 SAU 引擎棋盘</small></header>
<section><div><canvas id="board" width="720" height="720" aria-label="九路不围棋棋盘，点击交叉点落子"></canvas>
<footer>坐标与引擎一致：横、纵轴均为 A–I，AA 位于左上角。红圈表示上一手。</footer>
<p>规则：黑先白后，轮流落子。<b>不能提掉对方棋子，不能自杀，不能停着。</b>轮到某方时没有合法落点，该方输。</p></div>
<aside class="panel"><div id="status" class="status" role="status" aria-live="polite">正在连接…</div><div id="error" class="error" role="alert"></div>
<label for="mode">对局模式</label><select id="mode"><option value="ha">我执黑 · AI 执白</option><option value="ah">AI 执黑 · 我执白</option><option value="hh">双人同机对弈</option><option value="aa">AI 对战 AI</option></select>
<label for="seconds">AI 每手思考上限</label><select id="seconds"><option value="2">2 秒 · 快速体验</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="60">60 秒 · 原包上限</option></select>
<button id="new" class="primary">开始新局</button><button id="pause" style="margin-top:8px" disabled>暂停 AI</button>
<div class="row"><input id="hints" type="checkbox" checked><label for="hints">显示当前方合法落点</label></div>
<div class="row"><input id="numbers" type="checkbox"><label for="numbers">显示手数</label></div>
<button id="download">导出棋谱 JSON</button><p class="muted" id="clock">AI 用时：黑 0 秒 / 白 0 秒</p><div class="moves" id="moves">暂无棋步</div>
<p class="muted" style="font-size:12px">时长和模式在新局生效。用时含引擎响应开销，仅供本地训练参考；正式比赛请遵循裁判规则。</p></aside></section></main>
<script>
const token='__TOKEN__';
const $=id=>document.getElementById(id), c=$('board'), ctx=c.getContext('2d');
let state=null,busy=false,paused=false,notice='',operation='';
function draw(){
 ctx.clearRect(0,0,720,720);ctx.fillStyle='#dfbb80';ctx.fillRect(0,0,720,720);
 ctx.strokeStyle='#695533';ctx.lineWidth=1.3;
 for(let n=0;n<9;n++){let p=64+n*74;ctx.beginPath();ctx.moveTo(64,p);ctx.lineTo(656,p);ctx.moveTo(p,64);ctx.lineTo(p,656);ctx.stroke();ctx.fillStyle='#604d31';ctx.font='17px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String.fromCharCode(65+n),p,30);ctx.fillText(String.fromCharCode(65+n),30,p)}
 for(let y of [2,4,6])for(let x of [2,4,6]){if((x===4)!==(y===4))continue;ctx.beginPath();ctx.arc(64+x*74,64+y*74,4,0,Math.PI*2);ctx.fill()}
 if(!state)return;
 if($('hints').checked&&!state.over)for(let i of state.legal){ctx.fillStyle='rgba(40,88,55,.22)';ctx.beginPath();ctx.arc(64+i%9*74,64+Math.floor(i/9)*74,6,0,Math.PI*2);ctx.fill()}
 let nums=new Map(state.history.map(m=>[m.index,m.number]));
 state.board.forEach((s,i)=>{if(!s)return;let x=64+i%9*74,y=64+Math.floor(i/9)*74;ctx.shadowColor='#0005';ctx.shadowBlur=5;ctx.shadowOffsetY=2;ctx.fillStyle=s===1?'#202622':'#fffdf5';ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle=s===1?'#111':'#a99e8a';ctx.stroke();if($('numbers').checked){ctx.fillStyle=s===1?'white':'#222';ctx.font='17px sans-serif';ctx.fillText(nums.get(i),x,y)}});
 if(state.history.length){let i=state.history.at(-1).index;ctx.strokeStyle='#d54c35';ctx.lineWidth=3;ctx.beginPath();ctx.arc(64+i%9*74,64+Math.floor(i/9)*74,34,0,Math.PI*2);ctx.stroke()}
}
function render(){
 draw();if(!state)return;
 $('status').textContent=busy?(operation==='step'?'AI 正在思考，请稍候…':'正在处理，请稍候…'):state.message+(paused&&!state.over?'（AI 已暂停）':'');
 $('error').textContent=notice;
 $('new').disabled=busy;
 $('pause').disabled=state.over||!Object.values(state.players).includes('ai');
 $('pause').textContent=paused?'继续 AI':'暂停 AI';
 $('clock').textContent=`AI 用时：黑 ${state.spent['1'].toFixed(1)} 秒 / 白 ${state.spent['-1'].toFixed(1)} 秒`;
 $('moves').textContent=state.history.map(m=>`${m.number}. ${m.side===1?'黑':'白'} ${m.coord} ${m.seconds?`· ${m.seconds.toFixed(2)}s`:''}`).join('\n')||'暂无棋步';$('moves').style.whiteSpace='pre-line';$('moves').scrollTop=$('moves').scrollHeight;
}
async function api(path,data){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-NoGo-Token':token},body:JSON.stringify(data||{})});let s=await r.json();if(!r.ok)throw Error(s.error||'请求失败');return s}
async function act(path,data){if(busy)return;busy=true;operation=path;notice='';render();try{state=await api(path,data)}catch(e){notice=e.message;paused=true;try{state=await (await fetch('/api/state')).json()}catch{notice+='；无法连接服务，请检查启动终端。'}}finally{busy=false;render()}}
$('new').onclick=async()=>{if(state?.history.length&&!state.over&&!confirm('结束当前对局并开始新局？'))return;paused=false;await act('new',{mode:$('mode').value,seconds:Number($('seconds').value)})};
$('pause').onclick=()=>{paused=!paused;render()};
$('hints').onchange=draw;$('numbers').onchange=draw;
c.onclick=e=>{if(!state||busy||state.over||state.players[String(state.side)]!=='human')return;let r=c.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*720/r.width-64)/74),y=Math.round(((e.clientY-r.top)*720/r.height-64)/74);if(x>=0&&x<9&&y>=0&&y<9)act('move',{move:y*9+x})};
$('download').onclick=()=>{if(!state)return;let u=URL.createObjectURL(new Blob([JSON.stringify({format:'nogo-local-sau-v1',exported_at:new Date().toISOString(),...state},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='NoGo-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
setInterval(()=>{if(state&&!busy&&!paused&&!state.over&&state.players[String(state.side)]==='ai')act('step')},250);
fetch('/api/state').then(r=>r.json()).then(s=>{state=s;render()}).catch(()=>{$('status').textContent='无法连接，请重新启动棋盘平台。'});draw();
</script></html>
